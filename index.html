/*
----------------------------------------------------------
DATE ENGINE
----------------------------------------------------------
*/

const dateFormatter = new Intl.DateTimeFormat("en-NG",{
  weekday:"long",
  day:"numeric",
  month:"long",
  year:"numeric"
});

let selectedDate = new Date(START_DATE + "T00:00:00");

function localDateKey(date){
  return [
    date.getFullYear(),
    String(date.getMonth()+1).padStart(2,"0"),
    String(date.getDate()).padStart(2,"0")
  ].join("-");
}

function parseKey(key){
  return new Date(key + "T00:00:00");
}

function todayAtMidnight(){
  const d = new Date();
  return new Date(d.getFullYear(),d.getMonth(),d.getDate());
}

function getEntry(key){
  return letters.find(item => item.date === key);
}

function showDate(date){
  const key = localDateKey(date);
  const entry = getEntry(key);

  if(!entry){
    showOutsideRange();
    return;
  }

  selectedDate = date;

  document.getElementById("date").textContent =
    dateFormatter.format(date);

  document.getElementById("scripture").textContent =
    entry.scripture;

  document.getElementById("reference").textContent =
    entry.reference;

  document.getElementById("letter").innerHTML =
    entry.letter.replace(/\n/g,"<br>");

  document.getElementById("motivation").textContent =
    entry.motivation;

  restartAnimation();
}

function restartAnimation(){
  const card = document.getElementById("card");
  card.style.animation = "none";
  void card.offsetWidth;
  card.style.animation = "appear .8s ease";
}

function showOutsideRange(){
  document.getElementById("date").textContent =
    dateFormatter.format(selectedDate);

  document.getElementById("scripture").textContent =
    "This little journey is waiting for you.";

  document.getElementById("reference").textContent =
    "Come back when the date arrives.";

  document.getElementById("letter").innerHTML =
    `Àyànfẹ́,<br><br>
    There is a word for every one of these thirty days.
    <br><br>
    This one isn't its day yet.
    <br><br>
    So come back when it is.`;

  document.getElementById("motivation").textContent =
    "Some things are worth waiting for.";
  restartAnimation();
}

function previousDate(){
  const d = new Date(selectedDate);
  const start = parseKey(START_DATE);
  d.setDate(d.getDate()-1);

  if(d < start){
    return;
  }

  selectedDate = d;
  showDate(d);
}

function goToday(){
  const today = todayAtMidnight();
  const start = parseKey(START_DATE);
  const end = new Date(start);
  end.setDate(end.getDate()+29);

  if(today >= start && today <= end){
    selectedDate = today;
    showDate(today);
  }else{
    selectedDate = start;
    showDate(start);
  }
}

/*
----------------------------------------------------------
INITIAL LOAD
----------------------------------------------------------
*/

(function init(){
  const today = todayAtMidnight();
  const start = parseKey(START_DATE);
  const end = new Date(start);
  end.setDate(end.getDate()+29);

  if(today >= start && today <= end){
    selectedDate = today;
  }else{
    selectedDate = start;
  }

  showDate(selectedDate);
})();
</script>
